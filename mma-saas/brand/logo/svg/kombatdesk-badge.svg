<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="116" fill="#0A0A0A"/>
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#E02020" stroke-width="10" opacity="0.55"/>
  <g transform="translate(17.45,30.10) scale(0.903614)">
    <defs>
    <linearGradient id="kd-hood" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2a1e21"/>
      <stop offset="0.5" stop-color="#141216"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="kd-bandGrad" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="0.55" stop-color="#e02020"/>
      <stop offset="1" stop-color="#8f1414"/>
    </linearGradient>
    <linearGradient id="kd-tailA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e02020"/>
      <stop offset="1" stop-color="#ff4d4d"/>
    </linearGradient>
    <linearGradient id="kd-tailB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f1414"/>
      <stop offset="1" stop-color="#c01a1a"/>
    </linearGradient>
    <linearGradient id="kd-eyeGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e2faff"/>
      <stop offset="1" stop-color="#4fd2ff"/>
    </linearGradient>
    <filter id="kd-eyeGlow" x="-200%" y="-320%" width="500%" height="740%">
      <feGaussianBlur stdDeviation="18" result="b1"/>
      <feFlood flood-color="#39c6ff" flood-opacity="1"/>
      <feComposite in2="b1" operator="in" result="g1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2"/>
      <feFlood flood-color="#f0fdff" flood-opacity="1"/>
      <feComposite in2="b2" operator="in" result="g2"/>
      <feMerge>
        <feMergeNode in="g1"/>
        <feMergeNode in="g1"/>
        <feMergeNode in="g2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="kd-hoodClip">
      <path d="M226 84 L344 150 L356 258 L334 344 L274 416 L178 416 L118 344 L96 258 L108 150 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(-38,0)">

    <!-- headband tails, behind the hood -->
    <path d="M330 188 L508 142 L482 168 L506 176 L336 228 Z" fill="url(#kd-tailA)"/>
    <path d="M334 220 L474 240 L452 250 L470 270 L330 250 Z" fill="url(#kd-tailB)"/>

    <!-- hood silhouette -->
    <path d="M226 84 L344 150 L356 258 L334 344 L274 416 L178 416 L118 344 L96 258 L108 150 Z"
          fill="url(#kd-hood)" stroke="#e02020" stroke-width="14" stroke-linejoin="miter"/>

    <g clip-path="url(#kd-hoodClip)">
      <!-- crown facet -->
      <path d="M226 84 L344 150 L226 190 L108 150 Z" fill="#ffffff" opacity="0.055"/>
      <!-- lower wrap fold -->
      <path d="M96 330 L356 330 L274 416 L178 416 Z" fill="#000000" opacity="0.35"/>
      <path d="M226 336 L306 372 L274 416 L178 416 L146 372 Z" fill="#ffffff" opacity="0.03"/>
      <!-- cloth wrap seam across the lower face -->
      <path d="M96 352 L356 336 L356 346 L96 362 Z" fill="#e02020" opacity="0.30"/>
      <path d="M226 362 L240 416 L212 416 Z" fill="#e02020" opacity="0.18"/>

      <!-- headband -->
      <path d="M86 188 L364 188 L364 240 L86 240 Z" fill="url(#kd-bandGrad)"/>
      <path d="M86 188 L364 188 L364 199 L86 199 Z" fill="#ffffff" opacity="0.18"/>
      <path d="M86 232 L364 232 L364 240 L86 240 Z" fill="#000000" opacity="0.25"/>
      <!-- knot -->
      <path d="M316 188 L364 188 L364 240 L316 240 L336 214 Z" fill="#8f1414"/>

      <!-- eye slot -->
      <path d="M86 240 L364 240 L356 320 L96 320 Z" fill="#050507"/>
    </g>

    <!-- eyes -->
    <g filter="url(#kd-eyeGlow)">
      <path d="M116 258 L210 282 L210 302 L116 272 Z" fill="url(#kd-eyeGrad)"/>
      <path d="M336 258 L242 282 L242 302 L336 272 Z" fill="url(#kd-eyeGrad)"/>
    </g>
  </g>
  </g>
</svg>
